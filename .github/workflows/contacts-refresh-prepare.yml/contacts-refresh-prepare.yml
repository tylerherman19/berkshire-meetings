          git diff --quiet origin/main...HEAD -- data/contacts.json
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os
          from pathlib import Path
          old=Path("data/contacts.json").read_bytes();new=lzma.decompress(base64.b64decode(os.environ["P"].strip()))
          assert hashlib.sha256(old).hexdigest()==os.environ["B"] and hashlib.sha256(new).hexdigest()==os.environ["C"]
          a,b=json.loads(old),json.loads(new); d=[]
          assert a.keys()==b.keys() and all(a[k]==b[k] for k in a if k!="towns")
          for x,y in zip(a["towns"],b["towns"]):
           assert x["name"]==y["name"] and len(x["boards"])==len(y["boards"]) and all(x[k]==y[k] for k in x if k!="boards")
           for q,r in zip(x["boards"],y["boards"]):
            assert q["name"]==r["name"]
            if q!=r:d.append((x["name"],q["name"],[k for k in q if q[k]!=r.get(k)]))
          assert d==[("Alford","Select Board",["members"])],d
          m=next(z for t in b["towns"] if t["name"]=="Alford" for z in t["boards"] if z["name"]=="Select Board")["members"]
          assert m==[{"name":"James Hall","role":"Member"},{"name":"Peter Puciloski","role":"Member"},{"name":"Bruce Schreiber","role":"Chair"}]
          Path("data/contacts.json").write_bytes(new)
