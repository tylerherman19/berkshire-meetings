name: Scrape town meetings

on:
  schedule:
    - cron: "2 10 * * *" # 6:02 AM ET daily (off the congested :00 minute)
  workflow_dispatch:

permissions:
  contents: write

# One scrape at a time: concurrent runs raced on data/meetings.json and git
# merged two fully-regenerated JSON files into an inconsistent chimera.
concurrency:
  group: scrape-meetings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Scrape meetings
        run: python scraper/scrape.py
      - name: Commit updated data
        run: |
          git config user.name "meetings-bot"
          git config user.email "meetings-bot@users.noreply.github.com"
          git add data/meetings.json data/agenda_text.json data/changes.json
          # NOTE: do NOT add -X theirs here. The data file is fully regenerated
          # each run; auto-resolving hunks once merged two runs' outputs into an
          # inconsistent file. Concurrency above prevents the race; if a rebase
          # ever conflicts now, fail loudly instead of publishing a chimera.
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update meetings data"
          # Retry the push: on Oct 23, 2026 a transient GitHub Internal Server
          # Error rejected an otherwise clean push and killed the whole run
          # after a ~100-minute scrape. Rebase is redone each attempt; a real
          # conflict still fails every attempt and the step fails loudly.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; cleaning up and retrying in 30s..."
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          echo "Push failed after 5 attempts."
          exit 1
