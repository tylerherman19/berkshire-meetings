name: Scrape town meetings

on:
  schedule:
    - cron: "0 10 * * *" # 6:00 AM ET daily
  workflow_dispatch:

permissions:
  contents: write

# One scrape at a time: concurrent runs raced on data/meetings.json and git
# merged two fully-regenerated JSON files into an inconsistent chimera.
concurrency:
  group: scrape-meetings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Scrape meetings
        run: python scraper/scrape.py
      - name: Commit updated data
        run: |
          git config user.name "meetings-bot"
          git config user.email "meetings-bot@users.noreply.github.com"
          git add data/meetings.json
          # NOTE: do NOT add -X theirs here. The data file is fully regenerated
          # each run; auto-resolving hunks once merged two runs' outputs into an
          # inconsistent file. Concurrency above prevents the race; if a rebase
          # ever conflicts now, fail loudly instead of publishing a chimera.
          git diff --cached --quiet || (git commit -m "Update meetings data" && git pull --rebase && git push)
