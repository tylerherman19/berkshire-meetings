name: Checks

# Cheap guards that run on every push and pull request. The encoding check
# exists because app.js and index.html were once committed after a Latin-1
# round trip, which put literal garbage in place of every dash, dot and star
# on the live site. It is not the kind of thing to catch by eye twice.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check text files for mojibake
        run: python scraper/check_encoding.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check the front-end JavaScript
        run: |
          node --check app.js
          node --check blotter.js
      - name: Validate the data files parse as JSON
        run: |
          for f in data/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done
