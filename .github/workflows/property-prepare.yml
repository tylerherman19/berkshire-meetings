name: Prepare property feature
on:
  push:
    branches: [property-data]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/property-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Materialize reviewed files
        shell: python
        run: |
          import base64,json,pathlib
          files=json.loads('{"property.js": "", "property.css": "", "property-collector.py": "", "property-method.md": "", "index.html": "", "money.js": "", ".gitignore": "LnByb3BlcnR5LWNhY2hlLwpfX3B5Y2FjaGVfXy8K"}')
          for name,body in files.items(): pathlib.Path(name).write_bytes(base64.b64decode(body))
      - name: Pull official town snapshots
        run: python property-collector.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check encoding, syntax and JSON
        run: |
          python scraper/check_encoding.py
          node --check property.js
          node --check money.js
          python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').glob('property-*.json')]"
      - name: Commit prepared feature and remove one-time bootstrap
        run: |
          rm .github/workflows/property-prepare.yml
          rm -rf .github/workflows/.github
          git config user.name "Property data build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property* index.html money.js .gitignore .github/workflows/property-prepare.yml
          git commit -m "Add reviewed MassGIS property feature and town snapshots"
          git push
