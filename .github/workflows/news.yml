name: Scrape town news

# Hourly, 6:00 AM to midnight Eastern.
#
# Cron is UTC and has no idea about daylight saving, so the schedule below is
# the union of both offsets — 6:00 AM ET is 10:00 UTC in summer and 11:00 UTC
# in winter, midnight ET is 04:00 UTC in summer and 05:00 UTC in winter. The
# scraper itself checks the Eastern clock and exits without writing when it is
# woken outside the window, which is what actually holds the edges year-round.
on:
  schedule:
    - cron: "7 10-23,0-4 * * *" # hourly off the congested :00 minute
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the 6am-midnight ET window"
        type: boolean
        default: true

permissions:
  contents: write

# Same reasoning as the meetings scraper: data/news.json is rewritten whole
# each run, so two concurrent runs would race on the file and on git.
concurrency:
  group: scrape-news
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Scrape news
        run: python scraper/news.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}
      - name: Commit updated data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update town news"
          # Retry the push, as the meetings workflow does: a transient GitHub
          # error, or another bot pushing to main in the same moment, should
          # not fail the run. A real rebase conflict fails every attempt.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; cleaning up and retrying in 30s..."
            git rebase --abort 2>/dev/null || true
            sleep 30
          done
          echo "Push failed after 5 attempts."
          exit 1
