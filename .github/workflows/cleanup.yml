name: Clean up misplaced Contacts bootstrap
on:
  push:
    branches: [contacts-refresh-nov17]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/contacts-refresh-nov17'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove misplaced bootstrap and this cleanup workflow
        run: |
          git rm -r -q .github/workflows/contacts-prepare.yml
          git rm -q .github/workflows/cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove misplaced bootstrap from refresh branch"
          git push origin HEAD:contacts-refresh-nov17
